<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线模式</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: sans-serif;
        background: linear-gradient(180deg, #07131f, #0b1f2d);
        color: #eef6fb;
      }

      main {
        width: min(92vw, 28rem);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.8rem;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: rgba(238, 246, 251, 0.8);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线模式</h1>
      <p>如果你之前已经打开过首页，浏览器会优先展示缓存内容。联网后刷新一次，就能拿到最新成长数据。</p>
    </main>
  </body>
  </html>
